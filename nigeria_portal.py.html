<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigeria State Portal - Loud Audio Edition</title>
    <style>
        :root {
            --bg-dark: #05070f;
            --card-bg: #0b0f1d;
            --text-main: #f3f4f6;
            --naija-green: #00ff87;
            --error-red: #ff4a4a;
            --accent-glow: #00f2fe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
            radial-gradient(at 0% 0%, hsla(154,100%,46%,0.2) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(330,100%,50%,0.15) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
        }

        /* -------------------------------------------------------------
           NON-STOP SPARKLING RAINBOW LIGHTS ENGINE
        ------------------------------------------------------------- */
        .portal-wrapper { 
            width: 92%;
            max-width: 500px;
            padding: 8px;
            border-radius: 32px;
            background: linear-gradient(45deg, #ff0000, #ff7700, #ffeb00, #00ff00, #0022ff, #7500ff, #ff00c8, #ff0000);
            background-size: 400% 400%;
            animation: 
                rainbowMove 2.5s linear infinite,
                sparkleLights 0.15s alternate infinite ease-in-out;
            box-shadow: 0 0 50px rgba(0, 255, 135, 0.4);
        }

        @keyframes rainbowMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes sparkleLights {
            0% { filter: brightness(0.9) drop-shadow(0 0 5px rgba(255, 255, 255, 0.3)); }
            100% { filter: brightness(2.8) drop-shadow(0 0 35px rgba(0, 242, 254, 1)); }
        }

        .portal-wrapper::before {
            content: '';
            position: absolute;
            top: -15px; left: -15px; right: -15px; bottom: -15px;
            background: inherit;
            border-radius: 40px;
            filter: blur(35px);
            opacity: 0.8;
            z-index: -1;
            animation: sparkleLights 0.1s alternate infinite ease-in-out;
        }

        .main-card {
            background-color: var(--card-bg);
            border-radius: 26px;
            padding: 45px 35px;
            text-align: center;
        }

        .portal-header {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 0.95rem;
            color: #9ca3af;
            margin-bottom: 35px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: superPop 0.35s cubic-bezier(0.34, 1.7, 0.64, 1);
        }

        @keyframes superPop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .input-group {
            margin: 25px 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: capitalize;
            text-align: center;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--naija-green);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 25px rgba(0, 255, 135, 0.4);
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            border: none;
            border-radius: 16px;
            color: #000;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            margin: 10px 0;
            box-shadow: 0 5px 15px rgba(0, 255, 135, 0.2);
        }

        button:active { transform: scale(0.96); }
        button.btn-secondary { background: rgba(255, 255, 255, 0.07); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: none; }
        button.btn-danger { background: transparent; color: var(--error-red); border: 1px solid rgba(255, 74, 74, 0.2); font-size: 0.95rem; box-shadow: none; }
        button.btn-accent { background: linear-gradient(135deg, #ff9900 0%, #ff5500 100%); color: #fff; }

        .score-pill {
            display: inline-block;
            background: rgba(0, 255, 135, 0.12);
            color: var(--naija-green);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 255, 135, 0.25);
        }

        .feedback-box {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 15px 0;
            min-height: 26px;
        }

        .text-success { color: var(--naija-green); text-shadow: 0 0 15px rgba(0,255,135,0.5); }
        .text-error { color: var(--error-red); }
    </style>
</head>
<body>

    <div class="portal-wrapper">
        <div class="main-card">
            
            <!-- SCREEN 1: AUDIO ACTIVATION WELCOME -->
            <div id="screen-welcome" class="screen active">
                <h1 class="portal-header">NIGERIA PORTAL</h1>
                <p class="tagline">Stadium Spark Edition</p>
                <p style="color: #ff9900; margin-bottom: 15px; font-weight: bold; font-size: 0.9rem;">⚠️ Turn up your device volume and click below to unlock the sound!</p>
                <button class="btn-accent" onclick="unlockAndLaunch()">🎵 Activate Sound & Launch</button>
            </div>

            <!-- SCREEN 2: STATE ENTRY -->
            <div id="screen-state" class="screen">
                <div class="score-pill">Verified: <span id="score-count">0</span> / 5</div>
                <h2>Query State</h2>
                
                <div class="input-group">
                    <input type="text" id="state-input" placeholder="Enter state name..." autocomplete="off">
                </div>
                <div id="state-feedback" class="feedback-box text-error"></div>
                <button onclick="handleStateSubmission()">Check Location</button>
            </div>

            <!-- SCREEN 3: MOTTO CHALLENGE -->
            <div id="screen-motto" class="screen">
                <h2>Validate Slogan</h2>
                <p style="color: #9ca3af; margin-top:5px;">State: <strong id="display-state" style="color: var(--accent-glow);"></strong></p>
                
                <div class="input-group">
                    <input type="text" id="motto-input" placeholder="Type official motto..." autocomplete="off">
                </div>
                
                <div id="motto-feedback" class="feedback-box"></div>

                <div>
                    <button id="btn-submit-motto" onclick="handleMottoSubmission()">Verify Slogan</button>
                    <button id="btn-next" style="display: none;" onclick="advanceSession()">Next State ➔</button>
                    <button id="btn-back" class="btn-secondary" style="display: none;" onclick="changeScreen('screen-state')">Go Back</button>
                </div>
                
                <div style="margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 15px;">
                    <button class="btn-danger" onclick="evaluateExitStatus()">Terminate Process</button>
                </div>
            </div>

            <!-- SCREEN 4: MILESTONE CHECKPOINT -->
            <div id="screen-checkpoint" class="screen">
                <h1 style="color: var(--naija-green); font-size: 2.2rem; margin-bottom: 10px;">⚡ Match Won! ⚡</h1>
                <p class="tagline">5 Records logged. Ready for the next level?</p>
                <button onclick="renewSession()">Next Round</button>
                <button class="btn-secondary" onclick="changeScreen('screen-exit')">Exit Now</button>
            </div>

            <!-- SCREEN 5: TERMINATION -->
            <div id="screen-exit" class="screen">
                <h2>Portal Offline</h2>
                <button onclick="window.location.reload()">Restart App</button>
            </div>

        </div>
    </div>

    <script>
        const database = {
            "abia": "god's own state", "adamawa": "land of beauty", "akwa ibom": "land of promise",
            "anambra": "light of the nation", "bauchi": "pearl of tourism", "bayelsa": "glory of all lands",
            "benue": "food basket of the nation", "borno": "home of peace", "cross river": "the people's paradise",
            "delta": "the big heart", "ebonyi": "salt of the nation", "edo": "heartbeat of the nation",
            "ekiti": "land of honour and integrity", "enugu": "coal city state", "gombe": "jewel in the savannah",
            "imo": "eastern heartland", "jigawa": "the new world", "kaduna": "centre of learning",
            "kano": "centre of commerce", "katsina": "home of hospitality", "kebbi": "land of equity",
            "kogi": "the confluence state", "kwara": "state of harmony", "lagos": "centre of excellence",
            "nasarawa": "home of solid minerals", "niger": "the power state", "ogun": "gateway state",
            "ondo": "sunshine state", "osun": "land of virtue", "oyo": "pace setter state",
            "plateau": "home of peace and tourism", "rivers": "treasure base of the nation",
            "sokoto": "seat of the caliphate", "taraba": "nature's gift to the nation",
            "yobe": "pride of the sahel", "zamfara": "farming is our pride", "fct": "centre of unity", "abuja": "centre of unity"
        };

        let currentPoints = 0;
        let selectedState = "";
        let audioCtx = null;

        // Force initialize audio system on user click
        function unlockAndLaunch() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            // Play a test sound immediately so you know it works
            playStadiumChime();
            
            // Say welcome
            executeVoice("Welcome to Nigeria Portal");
            
            // Go to game screen
            changeScreen('screen-state');
        }

        // High-Volume Synthesized Stadium Horn Chime Engine
        function playStadiumChime() {
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // Loud Major Stadium Chords
            
            notes.forEach((freq, idx) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = (idx % 2 === 0) ? 'sawtooth' : 'triangle'; // Heavy energetic texture
                osc.frequency.setValueAtTime(freq, now + (idx * 0.06));
                
                gain.gain.setValueAtTime(0.5, now + (idx * 0.06)); // Maximum audible drive
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6 + (idx * 0.06));
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + (idx * 0.06));
                osc.stop(now + 0.7 + (idx * 0.06));
            });
        }

        function changeScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function handleStateSubmission() {
            const raw = document.getElementById('state-input').value.trim().toLowerCase();
            const feedback = document.getElementById('state-feedback');
            
            if (database.hasOwnProperty(raw)) {
                selectedState = raw;
                feedback.innerHTML = "";
                
                document.getElementById('display-state').innerText = document.getElementById('state-input').value;
                document.getElementById('motto-input').value = "";
                document.getElementById('motto-input').disabled = false;
                document.getElementById('motto-feedback').innerHTML = "";
                document.getElementById('btn-back').style.display = 'none';
                document.getElementById('btn-submit-motto').style.display = 'block';
                document.getElementById('btn-next').style.display = 'none';
                
                changeScreen('screen-motto');
            } else {
                feedback.innerText = "Error: Stand invalid.";
                executeVoice("Wrong answer");
                triggerVibration();
            }
        }

        function handleMottoSubmission() {
            const userAns = document.getElementById('motto-input').value.trim().toLowerCase();
            const trueAns = database[selectedState];
            const feedback = document.getElementById('motto-feedback');

            if (userAns === trueAns || userAns.replace(/the\s+/g, '') === trueAns.replace(/the\s+/g, '')) {
                currentPoints++;
                document.getElementById('score-count').innerText = currentPoints;
                
                feedback.className = "feedback-box text-success";
                feedback.innerText = "Goal! Slogan Verified.";
                
                document.getElementById('motto-input').disabled = true;
                document.getElementById('btn-submit-motto').style.display = 'none';
                document.getElementById('btn-back').style.display = 'none';
                document.getElementById('btn-next').style.display = 'block';

                playStadiumChime();
                executeVoice("Right proceed");
            } else {
                feedback.className = "feedback-box text-error";
                feedback.innerText = "Foul! Incorrect Motto.";
                
                document.getElementById('btn-back').style.display = 'block';
                executeVoice("Wrong answer");
                triggerVibration();
            }
        }

        function advanceSession() {
            document.getElementById('state-input').value = "";
            if (currentPoints >= 5) {
                changeScreen('screen-checkpoint');
            } else {
                changeScreen('screen-state');
            }
        }

        function evaluateExitStatus() {
            if (confirm("Do you want to stay in the portal? \nClick 'OK' to Stay.\nClick 'Cancel' to Exit.")) {
                return;
            }
            changeScreen('screen-exit');
        }

        function renewSession() {
            currentPoints = 0;
            document.getElementById('score-count').innerText = currentPoints;
            document.getElementById('state-input').value = "";
            changeScreen('screen-state');
        }

        function executeVoice(phrase) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const vocalTrack = new SpeechSynthesisUtterance(phrase);
                vocalTrack.rate = 1.1; 
                vocalTrack.volume = 1.0; 
                window.speechSynthesis.speak(vocalTrack);
            }
        }

        function triggerVibration() {
            if ('vibrate' in navigator) {
                navigator.vibrate([150, 50, 150]);
            }
        }
    </script>
</body>
</html>
